name: CI - Application Tests & Build

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-app.yml"
  push:
    branches: [main, "feature/*", hernandev]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Unit Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar pruebas unitarias con Pytest
        run: |
          pytest backend/tests -v

  frontend-tests:
    name: Frontend Unit Tests & Build (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund

      - name: Ejecutar pruebas del frontend (Jest / RTL)
        working-directory: frontend
        run: |
          npm test -- --watchAll=false

      - name: Compilar build de producción
        working-directory: frontend
        run: |
          npm run build

  docker-build-check:
    name: Validar Construcción de Contenedores Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Imagen Backend
        run: |
          docker build --platform linux/amd64 ./backend

      - name: Test Build Imagen Frontend
        run: |
          docker build --platform linux/amd64 ./frontend
